package:
  id: cern-maps
  version: 0.1.4
  contract: 1
  min_core: 0.1.0
  publisher: cern
  name: CERN Maps
  description: Find buildings, rooms and points of interest on the CERN sites, look up their details, geocode a building number and get walking, cycling or driving directions with travel times from the public CERN Maps services (maps.cern.ch); read-only and keyless
  homepage: https://github.com/alexiri/aurora-addons-cern
apps:
  - about:
      id: cern-maps
      name: CERN Maps
      description: Let agents find a building, room or point of interest on the CERN sites, see where it is, and work out how to get from one place to another and how long it takes. The services are public and need no account.
      category: maps
      api_docs: https://maps.docs.cern.ch
      connect_note:
        text: "Nothing to enter: CERN Maps is read without signing in. Connect it to give an agent the right to query it; every request is checked against your rules and logged."
        url: https://maps.cern.ch
      label_hint: CERN Maps
    connect:
      - id: anonymous
        kind: fields
        fields: []
    # The gateway adds the fixed ArcGIS settings itself, so an agent sends only what it chooses
    # (the place, the stops, the travel mode). Every /arcgis request gets JSON (the HTML pages are
    # 403) in Swiss LV95 coordinates (the routing network's own system and the one CERN Maps links
    # use), so one pair of numbers serves a place, a route stop and a link. Values are set, not
    # added: an agent's own f/outSR/... is replaced.
    hosts:
      - match: { host: maps.cern.ch, path_prefix: /api }
        inject: []
      - match: { host: maps.cern.ch, path_prefix: /arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/query }
        inject:
          - query: { name: f, value: json }
          - query: { name: outSR, value: "2056" }
          - query: { name: outFields, value: "*" }
          - query: { name: returnGeometry, value: "false" }
          - query: { name: returnCentroid, value: "true" }
      - match: { host: maps.cern.ch, path_prefix: /arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve }
        inject:
          - query: { name: f, value: json }
          - query: { name: outSR, value: "2056" }
          - query: { name: outputLines, value: esriNAOutputLineNone }
          - query: { name: returnDirections, value: "true" }
          - query: { name: directionsLanguage, value: en }
          - query: { name: directionsLengthUnits, value: esriNAUMeters }
          - query: { name: returnStops, value: "false" }
      - match: { host: maps.cern.ch, path_prefix: /arcgis }
        inject:
          - query: { name: f, value: json }
          - query: { name: outSR, value: "2056" }
    # The ArcGIS server behind maps.cern.ch is large; only the catalogued requests may be made
    # (a request that matches no tool is blocked under every grant).
    grants:
      block_untooled: true
    tools:
      read:
        items:
          - { id: search_places, name: "Search buildings, rooms and points of interest", host: maps.cern.ch, path: /api/search, methods: [GET] }
          - { id: get_place, name: "Get the details and position of a place", host: maps.cern.ch, path: /arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/query, methods: [GET] }
          - { id: geocode, name: "Find a building by its number or name", host: maps.cern.ch, path: /arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates, methods: [GET] }
          - { id: get_travel_modes, name: "List the routing travel modes (walk, bike, car)", host: maps.cern.ch, path: /arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route, methods: [GET] }
          - { id: get_directions, name: "Route between two points with travel times", host: maps.cern.ch, path: /arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve, methods: [GET] }
    agent:
      instructions: |
        Plain GET requests to https://maps.cern.ch, no sign-in. Aurora adds the format and the
        settings; send only what is shown. Every position is x,y (Swiss LV95) and comes only from
        the service, as returned: never compute or convert coordinates yourself (the lat/lon in a
        search hit is not usable). A valid position on the CERN sites has seven digits each,
        x ≈ 2 49x xxx and y ≈ 1 12x xxx; anything else is wrong.
        1. Where is a place: a building number or name only → /arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=31
           gives candidates[0].location {x, y} (a room such as 31/1-010 finds nothing there). Anything
           else (a room "31/1-010" or "513 R-068", "Main Auditorium", "restaurant") →
           /api/search?query=...&resultRecordCount=5, then GET the chosen hit's document.url:
           features[0].attributes are its details, features[0].centroid {x, y}.
        2. Route: /arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve?stops=x1,y1;x2,y2&travelMode=3
           (3 walk, 2 bike, 1 car, 6 step-free). routes.features[0].attributes: Total_Meters and the
           minutes (Total_WalkTime, Total_BikeTime or Total_DriveTime); directions[0].features[].attributes.text
           are the steps. Answer with the mode, rounded distance and time, and the main roads.
           If a request fails, report its HTTP status and the error code and message exactly as
           returned (quote them); do not guess the cause, and give no distance or time that the route
           solver did not return: say they are unavailable.
        3. Link (no request): https://maps.cern.ch/?n=31 or ?n=31%2F1-010 (the label, encoded) for a place;
           https://maps.cern.ch/?travelMode=Pedestrian&itinerary={n:"31",c:{x:x1,y:y1}}~{n:"5",c:{x:x2,y:y2}}
           for a route (Bike, Car), percent-encoded; the route link needs coordinates from the service,
           so without them link each place by its label. Add "Open in CERN Maps" links to every answer,
           also when a request failed.

# CERN Maps: every tool has a positive case and a `negative <tool>:` case. No credentials exist.
- name: "search_places: a building number"
  request: { method: GET, url: "https://maps.cern.ch/api/search?query=513&filterBy=&resultOffset=0&resultRecordCount=5" }
  expect: { app: cern-maps, tool: search_places }
- name: "search_places: a room"
  request: { method: GET, url: "https://maps.cern.ch/api/search?query=513%20R-068&resultRecordCount=3" }
  expect: { app: cern-maps, tool: search_places }
- name: "negative search_places: POST selects no tool"
  request: { method: POST, url: "https://maps.cern.ch/api/search?query=513" }
  expect: { app: cern-maps }
- name: "get_place: the feature of a search hit"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/query?where=OBJECTID%3D%274159%27&outFields=*&f=json" }
  expect: { app: cern-maps, tool: get_place }
- name: "negative get_place: the feature editing endpoint selects no tool"
  request: { method: POST, url: "https://maps.cern.ch/arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/applyEdits" }
  expect: { app: cern-maps }
- name: "negative get_place: another layer of the FeatureServer selects no tool"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/1/query?where=1%3D1&f=json" }
  expect: { app: cern-maps }
- name: "geocode: a building number"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=513&f=json&maxLocations=3&outSR=4326" }
  expect: { app: cern-maps, tool: geocode }
- name: "negative geocode: another geocoder operation selects no tool"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/geocodeAddresses?f=json" }
  expect: { app: cern-maps }
- name: "get_travel_modes: the service description"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route?f=json" }
  expect: { app: cern-maps, tool: get_travel_modes }
- name: "negative get_travel_modes: POST selects no tool"
  request: { method: POST, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route" }
  expect: { app: cern-maps }
- name: "get_directions: a route between two coordinates"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve?stops=6.0459,46.2325;6.0526,46.2330&inSR=4326&returnRoutes=true&f=json" }
  expect: { app: cern-maps, tool: get_directions }
- name: "get_place: a search hit's document.url as given gets JSON, LV95 and the centroid"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/query?where=OBJECTID='632'" }
  expect:
    app: cern-maps
    tool: get_place
    upstream: { url: "https://maps.cern.ch/arcgis/rest/services/Hosted/LOC_MAPCERN/FeatureServer/0/query?where=OBJECTID='632'&f=json&outSR=2056&outFields=%2A&returnGeometry=false&returnCentroid=true" }
- name: "geocode: a building number as the instructions write it gets JSON in LV95"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=31" }
  expect:
    app: cern-maps
    tool: geocode
    upstream: { url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=31&f=json&outSR=2056" }
- name: "geocode: the agent's own f and outSR are replaced, not doubled"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=31&f=html&outSR=4326" }
  expect:
    app: cern-maps
    tool: geocode
    upstream: { url: "https://maps.cern.ch/arcgis/rest/services/Batiments/GeocodeServer/findAddressCandidates?SingleLine=31&f=json&outSR=2056" }
- name: "get_directions: building 31 to building 5 on foot, as the instructions write it"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve?stops=2492507.9,1121100.97;2493266.81,1121076.19&travelMode=3" }
  expect:
    app: cern-maps
    tool: get_directions
    upstream: { url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route/solve?stops=2492507.9,1121100.97;2493266.81,1121076.19&travelMode=3&f=json&outSR=2056&outputLines=esriNAOutputLineNone&returnDirections=true&directionsLanguage=en&directionsLengthUnits=esriNAUMeters&returnStops=false" }
- name: "get_travel_modes: the service description gets JSON"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route" }
  expect:
    app: cern-maps
    tool: get_travel_modes
    upstream: { url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/Route?f=json&outSR=2056" }
- name: "search_places: the search API gets nothing added"
  request: { method: GET, url: "https://maps.cern.ch/api/search?query=31&resultRecordCount=5" }
  expect:
    app: cern-maps
    tool: search_places
    upstream: { url: "https://maps.cern.ch/api/search?query=31&resultRecordCount=5" }
- name: "negative get_directions: a different network analysis service selects no tool"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/services/Routing/NetworkAnalysis/NAServer/ServiceArea/solveServiceArea?f=json" }
  expect: { app: cern-maps }
- name: "negative: the rest of the ArcGIS server is not a tool"
  request: { method: GET, url: "https://maps.cern.ch/arcgis/rest/admin/services?f=json" }
  expect: { app: cern-maps }
- name: "negative: another host is not this app"
  request: { method: GET, url: "https://example.org/api/search?query=513" }
  expect: {}

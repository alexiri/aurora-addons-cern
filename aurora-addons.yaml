# The fixed top of aurora-addons.yaml (scripts/release.sh manifest appends the addons).
# `signing_key` is the PUBLIC half of the repository key (cern-release.key.pub); the private half
# never enters this repository.
api: 1

repo:
  name: CERN addons
  description: >-
    Aurora app packages for CERN services: the CERN Phonebook (people and e-groups from the central
    directory) and CERN Maps (buildings, rooms, directions).
  homepage: https://github.com/alexiri/aurora-addons-cern
  contact: https://github.com/alexiri/aurora-addons-cern/issues

publisher: cern

signing_key: "H8ZeIj/CtmFqdOQl4Kfw7JrNEtFIv/R+LgwVksZ7mBc="
signing_key_description: "CERN addons release key"

addons:
  - id: cern-maps
    name: "CERN Maps"
    description: "Find buildings, rooms and points of interest on the CERN sites, look up their details, geocode a building number and get walking, cycling or driving directions with travel times from the public CERN Maps services (maps.cern.ch); read-only and keyless"
    versions:
      "0.1.1":
        package: https://github.com/alexiri/aurora-addons-cern/releases/download/v0.1.1/cern-maps-0.1.1.aurora-plugin
        sha256: 1e63d3e62b82c20d0ce00bef2c457f892cefef11d53f1f54d0dc30fea02bf4bc
        size_bytes: 14251
        min_core: "0.1.0"
      "0.1.0":
